name: parkfairy

services:
  postgres:
    image: postgis/postgis:17-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkfairy
      POSTGRES_PASSWORD: parkfairy
      POSTGRES_DB: parkfairy
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkfairy -d parkfairy']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  redis-data:
